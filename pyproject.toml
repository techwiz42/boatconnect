[project]
name = "boatconnect"
version = "0.1.0"
description = "Shared-boat calendar: find a boat, join as owner or crew, book trips and sign on"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "icalendar>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["boatconnect"]
